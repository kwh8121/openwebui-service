# Deploy an immutable kwh release tag to production.
#
# Consumed by the production deployment agent per the handoff protocol
# (`docs/manual/github-control-plane-local-agent-handoff.ko.md`).
#
# Runs only on a self-hosted runner bound to the `production` GitHub
# Environment. The Environment protection rule enforces maintainer
# approval before any step executes on the prod host.
#
# The workflow implements Layer B of the protocol: it does exactly
# what the human production deployment agent has been doing manually
# per per-release deploy guides, but automated and audited.
#
# All Issue evidence is written directly via `gh issue comment` using
# the fixed schemas defined in the handoff §"프로덕션 에이전트 Issue
# 응답 계약". No terminal copy-paste is required.

name: Deploy approved production release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Immutable release tag (v<X.Y.Z>-kwh.<N>). No RC, no main, no latest.'
        required: true
        type: string
      issue_number:
        description: 'Deployment request Issue number (posts progress/success/failure comments here).'
        required: true
        type: number
      guide_commit:
        description: 'Commit SHA that pins the per-release deploy guide (main branch).'
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  # Production paths — confirmed 2026-07-30. If any of these change,
  # update here and bump the handoff Prerequisites section.
  DEPLOY_DIR: /home/ubuntu/openwebui
  COMPOSE_FILE: /home/ubuntu/openwebui/docker-compose.deploy.yaml
  ENV_FILE: /home/ubuntu/openwebui/.env.openwebui.oauth
  DATA_DIR: /home/ubuntu/openwebui/openwebui
  PIPELINES_DATA: /app/pipelines
  COMPOSE_PROJECT: openwebui
  BACKUP_DIR: /home/ubuntu
  # Health check settings
  HEALTH_URL: http://localhost/health
  HEALTH_TIMEOUT_SECONDS: '300'
  HEALTH_POLL_INTERVAL_SECONDS: '5'

jobs:
  deploy:
    runs-on:
      - self-hosted
      - production
    environment: production
    permissions:
      contents: read
      issues: write
      packages: read

    steps:
      # ─── Validation ────────────────────────────────────────────────
      - name: Validate tag format
        run: |
          set -euo pipefail
          if ! [[ "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-kwh\.[0-9]+$ ]]; then
            echo "::error::tag '${{ inputs.tag }}' must match v<X.Y.Z>-kwh.<N> (no RC, no main, no latest)"
            exit 1
          fi

      - name: Validate deploy environment
        run: |
          set -euo pipefail
          test -f "${COMPOSE_FILE}" || { echo "::error::missing ${COMPOSE_FILE}"; exit 1; }
          test -f "${ENV_FILE}"     || { echo "::error::missing ${ENV_FILE}"; exit 1; }
          test -d "${DATA_DIR}"     || { echo "::error::missing ${DATA_DIR}"; exit 1; }
          test -f "${DATA_DIR}/webui.db" || { echo "::error::missing ${DATA_DIR}/webui.db"; exit 1; }

      # ─── Announce ──────────────────────────────────────────────────
      - name: Post dispatched comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ inputs.issue_number }} \
            --repo "${{ github.repository }}" \
            --body "$(cat <<EOF
          ## Deployment dispatched

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Runner: self-hosted production (\`${{ runner.name }}\`)
          Target: \`${{ inputs.tag }}\`
          Guide: \`docs/manual/kwh-deploy-guide-${{ inputs.tag }}.md\` at commit \`${{ inputs.guide_commit }}\`
          EOF
          )"

      # ─── Capture rollback anchor ───────────────────────────────────
      - name: Capture current running image (rollback anchor)
        run: |
          set -euo pipefail
          cd "${DEPLOY_DIR}"
          cid=$(OPENWEBUI_IMAGE_TAG=placeholder \
                OPENWEBUI_LOCAL_DATA="${DATA_DIR}" \
                OPENWEBUI_DEPLOY_ENV_FILE="${ENV_FILE}" \
                PIPELINES_LOCAL_DATA="${PIPELINES_DATA}" \
                docker compose -f "${COMPOSE_FILE}" -p "${COMPOSE_PROJECT}" ps -q openwebui 2>/dev/null || true)
          if [[ -z "$cid" ]]; then
            echo "::warning::no running openwebui container detected; rollback target unknown"
            echo "CURRENT_IMAGE=unknown" >> "$GITHUB_ENV"
          else
            current=$(docker inspect "$cid" --format '{{.Config.Image}}')
            echo "Currently running: $current"
            echo "CURRENT_IMAGE=$current" >> "$GITHUB_ENV"
            echo "CURRENT_TAG=${current##*:}" >> "$GITHUB_ENV"
          fi

      # ─── Pull new image and pin digest ─────────────────────────────
      - name: Pull new image
        run: |
          set -euo pipefail
          docker pull "ghcr.io/${{ github.repository }}:${{ inputs.tag }}"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "ghcr.io/${{ github.repository }}:${{ inputs.tag }}")
          echo "NEW_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "Pulled: $digest"

      # ─── Pre-deploy backup (MANDATORY) ─────────────────────────────
      - name: Stop openwebui and back up data
        id: backup
        run: |
          set -euo pipefail
          cd "${DEPLOY_DIR}"
          ts=$(date +%Y%m%d-%H%M%S)
          suffix="${CURRENT_TAG:-unknown}"
          backup_path="${BACKUP_DIR}/prod-backup-preupgrade-${ts}-${suffix}.tar.gz"
          export OPENWEBUI_IMAGE_TAG="${CURRENT_TAG:-${{ inputs.tag }}}"
          export OPENWEBUI_LOCAL_DATA="${DATA_DIR}"
          export OPENWEBUI_DEPLOY_ENV_FILE="${ENV_FILE}"
          export PIPELINES_LOCAL_DATA="${PIPELINES_DATA}"

          docker compose -f "${COMPOSE_FILE}" -p "${COMPOSE_PROJECT}" stop openwebui

          # WAL-safe: openwebui is stopped, WAL is committed to main DB before tar.
          # --warning=no-file-changed handles benign SQLite WAL races if any.
          # --ignore-failed-read tolerates permission-denied files (HF cache etc).
          if ! tar --warning=no-file-changed --ignore-failed-read \
                   -czf "${backup_path}" -C "${DEPLOY_DIR}" openwebui; then
            rc=$?
            # Accept exit=1 if archive exists and looks real
            if [[ -f "${backup_path}" ]] && [[ $(stat -c%s "${backup_path}") -gt 1048576 ]]; then
              echo "::warning::tar exit=${rc} but archive OK (size $(stat -c%s "${backup_path}") bytes)"
            else
              echo "::error::backup failed: tar exit=${rc}, archive missing or too small"
              exit 1
            fi
          fi

          size=$(du -h "${backup_path}" | cut -f1)
          echo "BACKUP_PATH=${backup_path}" >> "$GITHUB_ENV"
          echo "BACKUP_SIZE=${size}" >> "$GITHUB_ENV"
          echo "Backup: ${backup_path} (${size})"

      - name: Post checkpoint comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ inputs.issue_number }} \
            --repo "${{ github.repository }}" \
            --body "$(cat <<EOF
          ## Deployment checkpoint

          Backup: \`${BACKUP_PATH}\` (${BACKUP_SIZE})
          Migrations: applying (in progress)
          Health polling: not started (compose up next)
          EOF
          )"

      # ─── Deploy new image ──────────────────────────────────────────
      - name: Bring up new image
        run: |
          set -euo pipefail
          cd "${DEPLOY_DIR}"
          export OPENWEBUI_IMAGE_TAG="${{ inputs.tag }}"
          export OPENWEBUI_LOCAL_DATA="${DATA_DIR}"
          export OPENWEBUI_DEPLOY_ENV_FILE="${ENV_FILE}"
          export PIPELINES_LOCAL_DATA="${PIPELINES_DATA}"
          docker compose -f "${COMPOSE_FILE}" -p "${COMPOSE_PROJECT}" pull openwebui
          docker compose -f "${COMPOSE_FILE}" -p "${COMPOSE_PROJECT}" up -d --no-deps openwebui

      # ─── Migration monitoring + /health polling ────────────────────
      - name: Wait for /health (Alembic runs during boot)
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + HEALTH_TIMEOUT_SECONDS ))
          while (( $(date +%s) < deadline )); do
            if curl -sf --max-time 5 "${HEALTH_URL}" >/dev/null 2>&1; then
              echo "HEALTH_STATUS=OK" >> "$GITHUB_ENV"
              echo "/health reached 200"
              exit 0
            fi
            sleep "${HEALTH_POLL_INTERVAL_SECONDS}"
          done
          echo "::error::/health did not return 200 within ${HEALTH_TIMEOUT_SECONDS}s"
          echo "HEALTH_STATUS=TIMEOUT" >> "$GITHUB_ENV"
          exit 1

      - name: Technical smoke — logs + container state
        run: |
          set -euo pipefail
          cd "${DEPLOY_DIR}"
          export OPENWEBUI_IMAGE_TAG="${{ inputs.tag }}"
          export OPENWEBUI_LOCAL_DATA="${DATA_DIR}"
          export OPENWEBUI_DEPLOY_ENV_FILE="${ENV_FILE}"
          export PIPELINES_LOCAL_DATA="${PIPELINES_DATA}"
          state=$(docker compose -f "${COMPOSE_FILE}" -p "${COMPOSE_PROJECT}" ps openwebui --format '{{.State}}' 2>/dev/null || echo "unknown")
          echo "openwebui state: ${state}"
          if [[ "${state}" != "running" ]]; then
            echo "::error::openwebui state is '${state}', expected 'running'"
            exit 1
          fi
          echo "--- last 100 log lines (openwebui) ---"
          logs=$(docker compose -f "${COMPOSE_FILE}" -p "${COMPOSE_PROJECT}" logs --tail 100 openwebui 2>&1 || true)
          echo "${logs}"
          echo "--- end logs ---"
          if grep -Eiq 'Traceback|Failed to start|sqlalchemy\.exc' <<<"${logs}"; then
            echo "::error::startup error keywords detected in openwebui logs"
            exit 1
          fi

      # ─── Success / Failure reporting ───────────────────────────────
      - name: Post success comment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ inputs.issue_number }} \
            --repo "${{ github.repository }}" \
            --body "$(cat <<EOF
          ## Deployment success

          Image digest: \`${NEW_DIGEST}\`
          Backup retention: \`${BACKUP_PATH}\`
          Technical smoke: PASS (container running, /health 200, logs clean)
          Guide followed: \`docs/manual/kwh-deploy-guide-${{ inputs.tag }}.md\` at commit \`${{ inputs.guide_commit }}\`
          Awaiting user browser acceptance: OAuth, model chat, upload/RAG, branding/splash, custom tools as applicable.
          EOF
          )"

      - name: Post failure comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Report failure without auto-rollback. Per handoff §"장애 처리와 권한",
          # rollback authority depends on the failure stage; the maintainer decides.
          gh issue comment ${{ inputs.issue_number }} \
            --repo "${{ github.repository }}" \
            --body "$(cat <<EOF
          ## Deployment failed

          Run logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Stage: see step summary in the run
          Rollback status: halted for incident decision (auto-rollback NOT performed)
          Guide section: refer to \`docs/manual/kwh-deploy-guide-${{ inputs.tag }}.md\` for §8 rollback options
          Previous image (rollback target): \`${CURRENT_IMAGE:-unknown}\`
          Backup (if backup step reached): \`${BACKUP_PATH:-not-created}\`
          Next action required: maintainer decision per handoff §"장애 처리와 권한"
          EOF
          )"
